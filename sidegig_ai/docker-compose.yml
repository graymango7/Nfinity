services:
  db:
    image: postgres:15
    container_name: sidegig_db
    restart: always
    environment:
      POSTGRES_USER: sidegig
      # 8/30: 하드코딩 대신 .env의 POSTGRES_PASSWORD를 씁니다 (없으면 기존 기본값 유지).
      # 바꾸려면 .env의 DATABASE_URL 비밀번호도 반드시 같이 바꾸세요.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidegig_pw}
      POSTGRES_DB: sidegig
    # 9/2 보안 점검: 예전엔 "5432:5432"로 모든 인터페이스에 열려 있었습니다 — 이 파일로
    # 그대로 공인 IP가 있는 서버에 배포하면(예: VPS에 docker-compose로 직접 배포) 누구나
    # 인터넷에서 이 포트로 접속을 시도할 수 있었습니다(기본 비밀번호를 안 바꿨다면 더 위험).
    # api 컨테이너는 이 host 포트 매핑과 무관하게 도커 내부망(db:5432)으로 항상 접속되므로,
    # 127.0.0.1로 묶어도 앱 동작에는 영향이 없고, 로컬 개발 중 `psql -h localhost`로
    # 붙는 것도 그대로 됩니다 — 외부에서만 막힙니다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidegig"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: sidegig_redis
    restart: always
    # 9/2 보안 점검: Redis는 기본적으로 비밀번호 인증이 없어서, 예전처럼 "6379:6379"로
    # 열어두면 공인 IP가 있는 서버에서는 인증 없이 외부에서 누구나 읽고 쓸 수 있었습니다.
    # db와 동일한 이유로 127.0.0.1에만 묶습니다 — api 컨테이너는 도커 내부망(redis:6379)으로
    # 접속하므로 영향 없습니다.
    #
    # 9/2 세 번째 업데이트: 포트를 막아도 "도커 내부망에 컨테이너 하나만 뚫리면 Redis는
    # 무방비"라는 문제는 남아있어서, --requirepass로 인증까지 추가합니다. .env의
    # REDIS_PASSWORD 값을 그대로 씁니다 — REDIS_URL(redis://:<비밀번호>@redis:6379/0)의
    # 비밀번호와 반드시 일치해야 합니다. redis-py(app/redis_client.py, app/database.py)는
    # URL에 비밀번호가 있으면 자동으로 AUTH를 보내므로 앱 코드는 수정할 필요가 없습니다
    # (직접 redis://:test_pw@localhost:PORT/0 형태로 연결해서 확인 완료).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-sidegig_redis_pw}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-sidegig_redis_pw} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sidegig_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 로컬 개발 중 코드를 고치면 바로 반영되도록 바인드 마운트 (배포용 이미지 자체는
      # Dockerfile에서 COPY로 고정됩니다 — 이 volumes는 로컬 docker-compose에서만 씁니다)
      - ./app:/app/app
      - ./data_pipeline:/app/data_pipeline
      - ./frontend:/app/frontend
    # Dockerfile 기본 CMD(--reload 없음)를 로컬 개발용으로 덮어씁니다.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata:
