<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="./support.js"></script>
<title>절세장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#00D2A0; --mint-deep:#00A67E; --mint-pale:#E3F8F1;
    --ink:#14231F; --ink-soft:#6B7A74; --ink-faint:#9AA8A2;
    --bg:#F6FAF8; --card:#FFFFFF; --line:#E8F0EC;
    --danger:#FF5F5F; --danger-pale:#FFEBEA;
    --warning:#FFB238; --warning-pale:#FFF6E6;
    --teal:#00B4D8; --coral:#FF6F59; --slate:#8891A3;
    --radius:20px; --radius-sm:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    width:390px; min-height:844px; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR","Manrope",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"Manrope","Noto Sans KR",sans-serif; font-variant-numeric:tabular-nums;}
  .screen{display:flex; flex-direction:column; min-height:844px;}

  .header{padding:28px 22px 6px;}
  .header-title{font-size:19px; font-weight:800; letter-spacing:-.01em;}
  .header-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}

  .refund-card{
    margin:16px 20px 0; background:var(--mint); border-radius:var(--radius);
    padding:22px 22px; color:#fff; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 10px 24px -12px rgba(0,166,126,.5);
  }
  .refund-label{font-size:12.5px; font-weight:700; opacity:.9;}
  .refund-amount{font-size:26px; font-weight:800; margin-top:4px; letter-spacing:-.02em;}
  .refund-badge{
    font-size:11px; font-weight:800; background:rgba(255,255,255,.22); padding:6px 12px; border-radius:99px;
  }

  .queue-hint{
    display:flex; align-items:baseline; justify-content:space-between; margin:26px 22px 14px;
  }
  .section-title{font-size:15px; font-weight:800; letter-spacing:-.01em;}
  .section-count{font-size:12px; color:var(--ink-faint); font-weight:700;}

  /* swipe stack */
  .stack{position:relative; height:390px; margin:0 24px;}
  .swipe-card{
    position:absolute; inset:0; border-radius:24px; background:var(--card);
    box-shadow:0 18px 40px -18px rgba(20,35,31,.28); padding:24px 22px; display:flex; flex-direction:column;
  }
  .swipe-card.behind-1{transform:scale(.96) translateY(14px); opacity:.7; z-index:1;}
  .swipe-card.behind-2{transform:scale(.92) translateY(26px); opacity:.4; z-index:0;}
  .swipe-card.front{z-index:2;}

  .card-top{display:flex; align-items:flex-start; justify-content:space-between;}
  .merchant-icon{
    width:46px; height:46px; border-radius:14px; background:var(--mint-pale); color:var(--mint-deep);
    display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800;
  }
  .prob-ring{
    width:46px; height:46px; border-radius:50%;
    background:conic-gradient(var(--mint) 0% 82%, var(--line) 82% 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .prob-ring-hole{
    width:36px; height:36px; border-radius:50%; background:var(--card);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--mint-deep);
  }

  .card-mid{margin-top:22px;}
  .merchant-name{font-size:20px; font-weight:800; letter-spacing:-.01em;}
  .merchant-amount{font-size:15px; color:var(--ink-soft); font-weight:700; margin-top:4px;}

  .ai-tag-row{margin-top:18px; display:flex; align-items:center; gap:8px;}
  .ai-tag{
    font-size:12px; font-weight:800; background:var(--mint-pale); color:var(--mint-deep);
    padding:6px 12px; border-radius:99px;
  }
  .ai-reason{
    margin-top:14px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; background:var(--bg);
    border-radius:14px; padding:14px 16px;
  }

  .card-spacer{flex:1;}
  .swipe-hint{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); font-weight:700;}

  .action-row{
    display:flex; justify-content:center; align-items:center; gap:22px; margin:24px 0 8px;
  }
  .action-btn{
    width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px -8px rgba(20,35,31,.25); background:var(--card);
  }
  .action-btn svg{width:24px; height:24px;}
  .action-btn.reject{color:var(--danger);}
  .action-btn.accept{background:var(--mint); color:#fff;}
  .action-btn.undo{width:44px; height:44px; color:var(--ink-faint); box-shadow:none; background:transparent;}

  .queue-preview{padding:6px 20px 24px; display:flex; flex-direction:column; gap:8px;}
  .qp-row{
    display:flex; align-items:center; gap:12px; background:var(--card); border-radius:var(--radius-sm);
    padding:12px 15px; box-shadow:0 4px 14px -10px rgba(20,35,31,.12); opacity:.85;
  }
  .qp-icon{width:30px; height:30px; border-radius:9px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:13px; flex:none;}
  .qp-name{font-size:12.5px; font-weight:700; flex:1;}
  .qp-amount{font-size:12.5px; font-weight:700; color:var(--ink-soft);}

  .navbar{
    margin-top:auto; position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:10px 10px 18px;
  }
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:700;}
  .nav-item svg{width:22px; height:22px;}
  .nav-item.active{color:var(--mint-deep);}
  .nav-item:not(.active){color:var(--ink-faint);}
</style>
</head>
<body>
<div class="screen">

  <div class="header">
    <div class="header-title">절세장부</div>
    <div class="header-sub">스와이프로 업무 경비를 빠르게 분류하세요</div>
  </div>

  <div class="refund-card">
    <div>
      <div class="refund-label">예상 환급액</div>
      <div class="refund-amount num">128,400원</div>
    </div>
    <div class="refund-badge">인정 12건</div>
  </div>

  <div class="queue-hint">
    <div class="section-title">분류 대기</div>
    <div class="section-count">7건 남음</div>
  </div>

  <div class="stack">
    <div class="swipe-card behind-2"></div>
    <div class="swipe-card behind-1"></div>
    <div class="swipe-card front">
      <div class="card-top">
        <div class="merchant-icon">N</div>
        <div class="prob-ring"><div class="prob-ring-hole num">82%</div></div>
      </div>
      <div class="card-mid">
        <div class="merchant-name">노션</div>
        <div class="merchant-amount num">21,000원 · 8월 22일</div>
      </div>
      <div class="ai-tag-row">
        <span class="ai-tag">SW구독</span>
      </div>
      <div class="ai-reason">업무용으로 자주 쓰이는 협업 툴 구독료로 보여요. 최근 3개월 연속 결제 패턴이 확인됐어요.</div>
      <div class="card-spacer"></div>
      <div class="swipe-hint">
        <span>← 개인 지출</span>
        <span>업무 경비 인정 →</span>
      </div>
    </div>
  </div>

  <div class="action-row">
    <div class="action-btn undo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 14L4 9L9 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9H14C17.3 9 20 11.7 20 15C20 18.3 17.3 21 14 21H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div class="action-btn reject">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <div class="action-btn accept">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="queue-preview">
    <div class="qp-row">
      <div class="qp-icon">🎮</div>
      <div class="qp-name">게임아이템_스토어</div>
      <div class="qp-amount num">12,000원</div>
    </div>
    <div class="qp-row">
      <div class="qp-icon">☕</div>
      <div class="qp-name">스타벅스</div>
      <div class="qp-amount num">6,800원</div>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      예산
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3L4 6.5V11C4 15.5 7.4 19.7 12 21C16.6 19.7 20 15.5 20 11V6.5L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      리스크
    </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M3 10.5H21" stroke="currentColor" stroke-width="2"/></svg>
      장부
    </div>
  </div>

</div>
</body>
</html>
